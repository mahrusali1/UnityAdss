name: Build UnityAdss

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download App Inventor dependencies
        run: |
          rm -rf lib/appinventor
          git clone --depth 1 https://github.com/mit-cml/extension-deps.git lib/appinventor

      - name: Check App Inventor dependencies
        run: |
          echo "=== lib/appinventor ==="
          ls -lah lib/appinventor

          echo "=== JAR files ==="
          find lib/appinventor -maxdepth 1 -type f -name "*.jar" -print

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Check Unity Ads dependency
        run: |
          echo "=== lib/deps ==="
          ls -lah lib/deps

          echo "=== Unity Ads JAR ==="
          find lib/deps -maxdepth 1 -type f -name "*.jar" -print

      - name: Build Extension
        run: ant extensions

      - name: Diagnose build output
        run: |
          echo "========================================"
          echo "=== build/externalComponents-classes ==="
          echo "========================================"

          if [ -d build/externalComponents-classes ]; then
            ls -lah build/externalComponents-classes

            echo "--- Recursive contents ---"
            find build/externalComponents-classes -maxdepth 5 -print
          else
            echo "DIRECTORY TIDAK ADA"
          fi

          echo ""
          echo "========================================"
          echo "=== build/externalComponents ==="
          echo "========================================"

          if [ -d build/externalComponents ]; then
            ls -lah build/externalComponents

            echo "--- Recursive contents ---"
            find build/externalComponents -maxdepth 5 -print
          else
            echo "DIRECTORY TIDAK ADA"
          fi

          echo ""
          echo "========================================"
          echo "=== out ==="
          echo "========================================"

          if [ -d out ]; then
            ls -lah out

            echo "--- Recursive contents ---"
            find out -maxdepth 5 -print
          else
            echo "DIRECTORY TIDAK ADA"
          fi

          echo ""
          echo "========================================"
          echo "=== ALL AIX FILES ==="
          echo "========================================"

          find . -type f -name "*.aix" -print

      - name: Check AIX
        run: |
          echo "=== OUT ==="
          ls -lah out

          echo ""
          echo "=== AIX ==="
          find out -maxdepth 1 -type f -name "*.aix" -print

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: UnityAdss-AIX
          path: out/*.aix
          if-no-files-found: error
