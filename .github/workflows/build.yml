name: Build UnityAdss

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UnityAdss
        uses: actions/checkout@v4

      - name: Checkout App Inventor Extension Template
        uses: actions/checkout@v4
        with:
          repository: mit-cml/extension-template
          path: extension-template
          submodules: recursive

      - name: Copy extension source
        run: |
          rm -rf extension-template/src
          cp -r src extension-template/src

      - name: Copy extension dependencies
        run: |
          mkdir -p extension-template/lib/deps
          cp -f lib/deps/*.jar extension-template/lib/deps/

      - name: Build AIX
        working-directory: extension-template
        run: |
          ant extensions

      - name: Find AIX
        run: |
          find extension-template -name "*.aix" -print

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: UnityAdss
          path: extension-template/build/extensions/*.aix
          if-no-files-found: error
