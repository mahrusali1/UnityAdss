name: Build UnityAdss

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UnityAdss
        uses: actions/checkout@v4

      - name: Checkout App Inventor Extension Template
        uses: actions/checkout@v4
        with:
          repository: mit-cml/extension-template
          path: extension-template
          submodules: recursive

      - name: Copy source
        run: |
          rm -rf extension-template/src
          cp -r src extension-template/src

      - name: Copy dependencies
        run: |
          mkdir -p extension-template/lib/deps
          cp -f lib/deps/*.jar extension-template/lib/deps/

      - name: Build extension
        working-directory: extension-template
        run: |
          ant extensions

      - name: Inspect build output
        working-directory: extension-template
        run: |
          echo "=== OUT DIRECTORY ==="
          find out -maxdepth 5 -type f -print || true

          echo "=== BUILD DIRECTORY ==="
          find build -maxdepth 5 -type f -print | head -200 || true

          echo "=== ALL AIX FILES ==="
          find . -type f -iname "*.aix" -print || true

          echo "=== ALL ZIP FILES ==="
          find . -type f -iname "*.zip" -print || true

      - name: Prepare artifact
        run: |
          mkdir -p output

          find "$GITHUB_WORKSPACE" \
            -type f \
            -iname "*.aix" \
            -exec cp {} output/ \;

          echo "=== Files prepared for upload ==="
          ls -lah output

          if [ -z "$(find output -type f -iname '*.aix' -print -quit)" ]; then
            echo "ERROR: No AIX file was generated."
            exit 1
          fi

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: UnityAdss
          path: output/*.aix
          if-no-files-found: error
